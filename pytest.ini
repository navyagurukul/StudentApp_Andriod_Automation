[pytest]
addopts = -v -ra --strict-markers --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: fast happy-path checks that must always pass
    regression: full regression coverage
    connectivity: AltServer/app reachability + scene sanity
    login: login / authentication flows
    home: home / dashboard navigation
    lessons: lesson / learning flows
    tests_flow: quiz / assessment flows
    profile: profile and settings flows
    content: home content-hub flows (stories/wordfun/quiz/videos)
    stories: Stories area
    wordfun: Word Fun area
    quiz: Tests / Quiz area
    video: Fun Learn video playback + timeline seek
