name: EnglishGurukul Student Android Automation

on:
  pull_request:
    branches: ["dev"]

  push:
    branches: ["main","dev"]

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:

  # =========================================================
  # SMOKE TESTS
  # =========================================================
  smoke-tests:

    name: Smoke Tests

    runs-on: [self-hosted, Windows]

    env:
      APP_PACKAGE: com.OritSciencesPrivateLimited.EnglishGurukul.studentapp
      APP_ACTIVITY: io.branch.unity.BranchUnityActivity

      PLATFORM_NAME: Android
      DEVICE_NAME: 7245d3d80508

      APPIUM_SERVER: http://127.0.0.1:4723

    steps:

      # =====================================================
      # Checkout
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Setup Python
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # Setup Node + Appium
      # =====================================================
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium
        run: |
          npm install -g appium@2.11.3
          appium driver install uiautomator2@2.45.1
          appium driver list --installed

      # =====================================================
      # Verify Device (REAL DEVICE)
      # =====================================================
      - name: Verify Device
        run: |
          adb devices
          adb shell getprop ro.product.model

      # =====================================================
      # Kill Old Appium
      # =====================================================
      - name: Kill Old Appium
        shell: powershell
        run: |
          $connections = Get-NetTCPConnection -LocalPort 4723 -ErrorAction SilentlyContinue
          if ($connections) {
            $pids = $connections | Select-Object -ExpandProperty OwningProcess -Unique
            foreach ($p in $pids) {
              Stop-Process -Id $p -Force
            }
          }

      # =====================================================
      # Start Appium Server
      # =====================================================
      - name: Start Appium
        shell: powershell
        run: |
          Start-Process cmd.exe -ArgumentList "/c appium --address 127.0.0.1 --port 4723 > appium.log 2>&1"
          Start-Sleep -Seconds 20

      - name: Verify Appium
        shell: powershell
        run: |
          curl http://127.0.0.1:4723/status

      # =====================================================
      # Run Tests
      # =====================================================
      - name: Run Smoke Tests
        run: |
          pytest -m smoke -v -s --alluredir=allure-results

      # =====================================================
      # Upload Reports
      # =====================================================
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-smoke-report
          path: allure-results/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-smoke-screenshots
          path: screenshots/

      - name: Upload Appium Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-appium-logs
          path: appium.log


  # =========================================================
  # REGRESSION TESTS
  # =========================================================
  regression-tests:

    name: Regression Tests

    runs-on: [self-hosted, Windows]

    needs: smoke-tests

    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'

    env:
      APP_PACKAGE: com.OritSciencesPrivateLimited.EnglishGurukul.studentapp
      APP_ACTIVITY: io.branch.unity.BranchUnityActivity

      DEVICE_NAME: 7245d3d80508
      APPIUM_SERVER: http://127.0.0.1:4723

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium
        run: |
          npm install -g appium@2.11.3
          appium driver install uiautomator2@2.45.1

      - name: Verify Device
        run: |
          adb devices

      - name: Start Appium
        shell: powershell
        run: |
          Start-Process cmd.exe -ArgumentList "/c appium --address 127.0.0.1 --port 4723 > appium.log 2>&1"
          Start-Sleep -Seconds 20

      - name: Run Regression Tests
        run: |
          pytest -m regression -v -s --alluredir=allure-results

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-regression-report
          path: allure-results/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-regression-screenshots
          path: screenshots/