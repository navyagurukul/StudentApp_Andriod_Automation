name: EnglishGurukul Student Android Automation

on:
  pull_request:
    branches: ["dev"]

  push:
    branches: ["main","dev"]

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:

  # =========================================================
  # SMOKE TESTS
  # =========================================================
  smoke-tests:

    name: Smoke Tests
    if: github.event_name != 'pull_request' || github.event_name == 'push_request' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows]

    env:
      APP_PACKAGE: com.OritSciencesPrivateLimited.EnglishGurukul.studentapp
      APP_ACTIVITY: io.branch.unity.BranchUnityActivity

      PLATFORM_NAME: Android
      DEVICE_NAME: 7245d3d80508

      APPIUM_PORT: 4723

    steps:

      # =====================================================
      # Checkout
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Verify Python
      # =====================================================
      - name: Verify Python
        shell: powershell
        run: |
          python --version
          pip --version
      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # Setup Node + Appium
      # =====================================================
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        
      - name: Verify Node
        shell: powershell
        run: |
          node -v
          npm -v

      - name: Remove Old Appium
        shell: powershell
        run: |
          npm uninstall -g appium
      - name: Install Stable Appium
        shell: powershell
        run: |
          npm install -g appium@2.11.3
          appium -v
      - name: Remove Old UiAutomator2 Driver
        shell: powershell
        run: |
          appium driver uninstall uiautomator2
      - name: Install Compatible UiAutomator2 Driver
        shell: powershell
        run: |
          appium driver install uiautomator2@2.45.1
      - name: Verify Installed Drivers
        shell: powershell
        run: |
          appium driver list --installed

      # =====================================================
      # Verify Device (REAL DEVICE)
      # =====================================================
      - name: Verify Device
        shell: powershell
        run: |
          adb devices

      # =====================================================
      # Kill Old Appium
      # =====================================================
      - name: Kill Old Appium
        shell: powershell
        run: |
          $connections = Get-NetTCPConnection -LocalPort 4723 -ErrorAction SilentlyContinue
          if ($connections) {
            $pids = $connections | Select-Object -ExpandProperty OwningProcess -Unique
            foreach ($p in $pids) {
              Stop-Process -Id $p -Force
            }
          }

      # =====================================================
      # Start Appium Server
      # =====================================================
      # ================= START APPIUM =================
      - name: Start Appium Server
        shell: powershell
        run: |
          Start-Process cmd.exe -ArgumentList "/c appium --address 127.0.0.1 --port 4723 > appium.log 2>&1"
          Start-Sleep -Seconds 20
      # ================= VERIFY APPIUM =================
      - name: Verify Appium Server
        shell: powershell
        run: |
          netstat -ano | findstr 4723
          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4723/status"
            Write-Host "Appium Server Running"
            $response
          }
          catch {
            Write-Host "Appium Server Failed"
            Get-Content appium.log
            exit 1
          }

      # =====================================================
      # Run Tests
      # =====================================================
      - name: Run Smoke Tests
        shell: powershell
        run: |
          pytest -m smoke -v -s --alluredir=allure-results

      # =====================================================
      # Upload Reports
      # =====================================================
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-smoke-report
          path: allure-results/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-smoke-screenshots
          path: screenshots/

      - name: Upload Appium Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-appium-logs
          path: appium.log


  # =========================================================
  # REGRESSION TESTS
  # =========================================================
  regression-tests:

    name: Regression Tests
    if: github.event_name != 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Windows]     

    env:
      APP_PACKAGE: com.OritSciencesPrivateLimited.EnglishGurukul.studentapp
      APP_ACTIVITY: io.branch.unity.BranchUnityActivity

      DEVICE_NAME: 7245d3d80508
