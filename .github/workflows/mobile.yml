            exit 1
          }

      - name: Run Regression Tests
        shell: powershell
        run: |
          pytest -m regression -v -s --alluredir=allure-results

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-regression-report
          path: allure-results/

